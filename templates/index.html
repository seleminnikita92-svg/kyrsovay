<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход | Система управления контактами</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { max-width: 400px; width: 100%; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background: white; }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="text-center mb-4">Вход в CRM</h3>
    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label">Имя пользователя (Логин)</label>
            <input type="text" class="form-control" id="username" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email (для регистрации)</label>
            <input type="email" class="form-control" id="email" value="admin@mail.ru" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Пароль</label>
            <input type="password" class="form-control" id="password" required>
        </div>
        <div id="error-msg" class="text-danger mb-3" style="display: none;"></div>
        <button type="button" class="btn btn-primary w-100 mb-2" onclick="auth('/login')">Войти</button>
        <button type="button" class="btn btn-outline-secondary w-100" onclick="auth('/register')">Регистрация</button>
    </form>
</div>

<script>
    async function auth(endpoint) {
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('error-msg');

        if (!username || !email || !password) {
            errorMsg.innerText = "Заполни все поля!";
            errorMsg.style.display = "block";
            return;
        }

        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('token', data.access_token);
                window.location.href = '/dashboard';
            } else {
                const err = await response.json();
                if (Array.isArray(err.detail)) {
                    errorMsg.innerText = "Косяк: проверь формат email и длину пароля (от 6 символов)";
                } else {
                    errorMsg.innerText = err.detail || "Неизвестная ошибка сервера";
                }
                errorMsg.style.display = "block";
            }
        } catch (e) {
            errorMsg.innerText = "Сервер не отвечает.";
            errorMsg.style.display = "block";
        }
    }
</script>
</body>
</html>
